# XcodeGen 專案定義。於 Mac 上執行：
#   brew install xcodegen && cd mobile/ios && xcodegen generate
# 產生 AIHot.xcodeproj（不提交到 Git）。
name: AIHot
options:
  bundleIdPrefix: com.dayacre
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: TB4CYA9PF6
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  AIHot:
    type: application
    platform: iOS
    sources:
      - path: AIHot
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: AIHot/Support/AIHot.entitlements
      properties:
        aps-environment: development
    info:
      path: AIHot/Support/Info.plist
      properties:
        CFBundleDisplayName: 日耕
        CFBundleName: AIHot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: com.dayacre.aihot
            CFBundleURLSchemes: [aihot]
        AIHotAPIBaseURL: https://aihot.dayacre.com
        # Cloudflare Worker 部署後填入，例如 https://aihot-push.<你的帳號>.workers.dev
        AIHotPushRegistrationURL: https://push.dayacre.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayacre.aihot
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 預設 AppIcon＝D14 初曦訊；其餘 29 款可在「我的 → App 圖示」更換
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-D01 AppIcon-D02 AppIcon-D03 AppIcon-D04 AppIcon-D05 AppIcon-D06 AppIcon-D07 AppIcon-D08 AppIcon-D09 AppIcon-D10 AppIcon-D11 AppIcon-D12 AppIcon-D13 AppIcon-D15 AppIcon-D16 AppIcon-D17 AppIcon-D18 AppIcon-D19 AppIcon-D20 AppIcon-D21 AppIcon-D22 AppIcon-D23 AppIcon-D24 AppIcon-D25 AppIcon-D26 AppIcon-D27 AppIcon-D28 AppIcon-D29 AppIcon-D30"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
  AIHotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIHotTests
      - path: Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AIHot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayacre.aihot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIHot:
    build:
      targets:
        AIHot: all
        AIHotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AIHotTests]
    archive:
      config: Release
