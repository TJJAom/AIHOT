name: 功能建議 / Feature request
description: 提出有明確使用場景的功能或改進。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        還在探索的想法可以先到 [想法交流區](https://github.com/KKKKhazix/AIHOT/discussions/categories/ideas) 討論。
        本倉庫不提供完整營運信源名單，也不持續維護微博、小紅書等平台的專用採集適配；可參考 [信源文件](https://github.com/KKKKhazix/AIHOT/blob/main/docs/sources.md) 接入外部採集結果。
        只有你的站需要的功能，可以在自己的倉庫裡做成模組放進 `modules/`，見 [架構文件](https://github.com/KKKKhazix/AIHOT/blob/main/docs/architecture.md#模組)。
  - type: textarea
    id: problem
    attributes:
      label: 使用場景與遇到的問題
      description: 誰在什麼情況下需要它？目前哪裡不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎樣改進
      description: 描述你希望看到的行為或結果，也可以附具體例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已嘗試的辦法（可選）
      description: 現有配置、指令碼或其他方案為什麼不能滿足需求？
