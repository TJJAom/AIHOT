name: 問題回饋 / Bug report
description: 報告可以復現的故障，幫助我們定位和修復。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        部署與使用問題可以先到 [問答區](https://github.com/KKKKhazix/AIHOT/discussions/categories/q-a) 交流。
        安全漏洞請透過 [私密漏洞報告](https://github.com/KKKKhazix/AIHOT/security/advisories/new) 提交。
        請勿上傳完整 .env、API Key、管理員密碼、Cookie 或生產資料庫。
  - type: input
    id: revision
    attributes:
      label: 程式碼版本
      description: 在倉庫目錄執行 git rev-parse --short HEAD；不確定時說明下載或更新日期。用 Use this template 生成的倉庫，提交號和本倉庫對不上，請寫生成日期或最近一次同步本倉庫的日期。
      placeholder: 提交號，或下載、生成、同步的日期
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 執行環境
      description: 寫明系統、Docker 或本機部署、相關版本；網頁問題請註明瀏覽器。
      placeholder: Ubuntu / macOS；Docker Compose / Node.js；是否有反向代理；是否改過相關配置。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 復現步驟
      description: 從哪個頁面、命令或操作開始？提供能復現問題的最少步驟。
      placeholder: |
        1. 開啟……
        2. 執行……
        3. 出現……
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 預期結果與實際結果
      placeholder: 預期……；實際……
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相關日誌或截圖（可選）
      description: 只貼相關片段，提交前移除金鑰、密碼、Cookie 和個人資訊；沒有日誌也可以提交。
