# RTX 雲端自動處理與獨立本機模型；與根目錄 docker-compose.yml 合併使用。
# 不發布模型主機埠，也不使用 Windows 既有 embedding Ollama 的模型目錄。
services:
  worker:
    profiles: [automation]
    cpus: "1.0"
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      MODEL_CALLS_ENABLED: "true"
      COLLECT_ENABLED: "true"
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: gpt-6-luna
      LLM_EXTRA_JSON: '{"reasoning_effort":"none"}'
      LLM_REASONING_TOKENS: "0"
      LLM_JSON_MODE: "true"
      LLM_VISION: "false"
      PREFILTER_MODEL: default
      SCORE_MODEL: default
      UNDERSTAND_MODEL: default
      SUMMARIZE_MODEL: default
      WORDING_MODEL: default
      STRUCTURE_MODEL: default
      GROUP_MODEL: default
      GROUP_REVIEW_MODEL: default
      DIGEST_MODEL: default
      REPORT_MODEL: default
      TRANSLATE_MODEL: default
      EMBEDDING_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      ZHIPU_API_KEY: ""
      XIAOMI_MIMO_API_KEY: ""
      JINA_API_KEY: ""
      SOCIALDATA_API_KEY: ""
      DAJIALA_KEY: ""
      FEISHU_CONTENT_PUSH_ENABLED: "false"
      # 飛書沒有設定；這個開關打開是為了讓告警經 WEBHOOK_HUB_URL 交給推播 Worker，轉成推播送到站長的 iPhone。
      FEISHU_INTERNAL_ENABLED: ${FEISHU_INTERNAL_ENABLED:-false}
      WEBHOOK_HUB_URL: ${WEBHOOK_HUB_URL:-}
      WEBHOOK_HUB_KEY: ${WEBHOOK_HUB_KEY:-}
      INDEXNOW_SUBMIT_ENABLED: "false"

  ollama:
    profiles: [local-ai]
    image: ollama/ollama:0.34.2@sha256:c715bebf769913db6c82d96f8a8dfee989c4bdfe19fa7d700e3d41ee0ceb5461
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 1m
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

volumes:
  ollama_models: {}
